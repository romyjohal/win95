<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calculator</title>
  <link rel="icon" href="../assets/icons/calculator.svg">
  <link rel="stylesheet" href="../assets/css/win95.css">
  <style>
    #app-window { width: 262px; }
    .calc { padding: 6px 8px 8px; display: flex; flex-direction: column; gap: 8px; }
    .calc-display {
      height: 25px; padding: 3px 6px; text-align: right; font-size: 13px; line-height: 19px;
      white-space: nowrap; overflow: hidden; user-select: text; -webkit-user-select: text;
    }
    .calc-row { display: flex; gap: 6px; align-items: center; }
    .calc-mem { width: 27px; height: 26px; box-shadow: var(--bevel-thin-in); display: grid; place-items: center; flex: none; }
    .calc button {
      height: 28px; padding: 0; border: 0; background: var(--face); box-shadow: var(--bevel-btn);
      color: #00f; font-size: 11px;
    }
    .calc button:active, .calc button.pressed { box-shadow: var(--bevel-btn-pressed); padding: 2px 0 0 2px; }
    .calc button.red { color: #f00; }
    .calc-top button { flex: 1; }
    .calc-main { display: flex; gap: 9px; }
    .calc-memcol { display: grid; grid-template-rows: repeat(4, 28px); gap: 5px; width: 34px; flex: none; }
    .calc-keys { flex: 1; display: grid; grid-template-columns: repeat(5, 1fr); grid-auto-rows: 28px; gap: 5px 5px; }
  </style>
</head>
<body data-root="../">
  <div class="desktop" id="desktop">
    <div class="window" id="app-window" data-title="Calculator" data-icon="calculator" data-maximizable="false">
      <div class="menubar">
        <div class="menu" data-label="&Edit">
          <div data-action="copy" data-shortcut="Ctrl+C">&Copy</div>
          <div data-action="paste" data-shortcut="Ctrl+V">&Paste</div>
        </div>
        <div class="menu" data-label="&View">
          <div data-action="standard" class="radio checked">S&tandard</div>
          <hr>
          <div data-action="grouping">&Digit grouping</div>
        </div>
        <div class="menu" data-label="&Help">
          <div data-action="about">&About Calculator</div>
        </div>
      </div>
      <div class="window-body calc">
        <div class="calc-display field" id="display">0.</div>
        <div class="calc-row calc-top">
          <div class="calc-mem" id="mem"></div>
          <button class="red" data-k="back">Backspace</button>
          <button class="red" data-k="ce">CE</button>
          <button class="red" data-k="c">C</button>
        </div>
        <div class="calc-main">
          <div class="calc-memcol">
            <button class="red" data-k="mc">MC</button>
            <button class="red" data-k="mr">MR</button>
            <button class="red" data-k="ms">MS</button>
            <button class="red" data-k="m+">M+</button>
          </div>
          <div class="calc-keys">
            <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
            <button class="red" data-k="/">/</button><button data-k="sqrt">sqrt</button>
            <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
            <button class="red" data-k="*">*</button><button data-k="%">%</button>
            <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
            <button class="red" data-k="-">-</button><button data-k="inv">1/x</button>
            <button data-k="0">0</button><button data-k="neg">+/-</button><button data-k=".">.</button>
            <button class="red" data-k="+">+</button><button class="red" data-k="=">=</button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="../assets/js/win95.js"></script>
  <script src="calculator.js"></script>
</body>
</html>
